spring.application.name=neuroshield-ai-backend
server.port=${SERVER_PORT:8080}

# ---------- MySQL (credentials come from environment variables) ----------
# DB_USERNAME and DB_PASSWORD have NO defaults on purpose: set them in your environment.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:neuroshield_db}?serverTimezone=UTC&useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# The schema is created by database/schema.sql. Use JPA_DDL_AUTO=validate to check entities against it.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# ---------- JSON / time ----------
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info

# ---------- Future Python FastAPI AI service (disabled until the contract exists) ----------
neuroshield.ai-service.enabled=${AI_SERVICE_ENABLED:false}
neuroshield.ai-service.base-url=${AI_SERVICE_BASE_URL:}
neuroshield.ai-service.predict-path=${AI_SERVICE_PREDICT_PATH:}
neuroshield.ai-service.connect-timeout-ms=${AI_SERVICE_CONNECT_TIMEOUT_MS:3000}
neuroshield.ai-service.read-timeout-ms=${AI_SERVICE_READ_TIMEOUT_MS:15000}
